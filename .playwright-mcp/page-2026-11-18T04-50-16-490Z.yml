      - 'heading "Achieving Milestone: Adding Blogs Section" [level=1] [ref=f3e94]'
      - paragraph [ref=f3e95]: Finally! The day has come. The stars have aligned, the code has compiled, and I have successfully added a blog section to my portfolio. It's a small step for a developer, but a giant leap for my procrastination.
      - heading "The Journey" [level=2] [ref=f3e96]
      - paragraph [ref=f3e97]: "It started with a simple thought: \"I should have a blog.\" That thought was immediately followed by a year of overthinking the design, 3 months of debating between a CMS and Markdown, and 2 weeks of actually writing code."
      - heading "Why Space Theme?" [level=3] [ref=f3e98]
      - paragraph [ref=f3e99]: Because why not? If I'm going to write about code, I might as well do it while floating in the void of the internet. Plus, dark mode is default in space.
